[package]
name = "arcane-cli"
version = "0.1.1"
edition = "2021"
description = "Official CLI for uploading and managing game builds on Arcane Powered"
license = "MIT"
repository = "https://github.com/Arcane-Powered/arcane-powered-cli"
readme = "README.md"
keywords = ["arcane", "gamedev", "cli", "builds", "fastcdc"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "arcane"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
dirs = "6.0"
futures = "0.3"
indicatif = "0.17"
rayon = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
walkdir = "2.5"
zstd = "0.13"

[dev-dependencies]
tempfile = "3.15"
wiremock = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
